name: Notify Docs Sync

on:
  workflow_call:
    inputs:
      sdk:
        description: Released package identifier (typescript, python, go, or cli)
        required: true
        type: string
      version:
        description: Semantic version without v prefix (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Git tag that triggered the release (e.g. ts/v0.1.0)
        required: true
        type: string
    secrets:
      FELINICS_BOT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch sync-sdk-docs to felinics/kibotos-docs
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to felinics/kibotos-docs
        env:
          BOT_TOKEN: ${{ secrets.FELINICS_BOT_TOKEN }}
          SDK_NAME: ${{ inputs.sdk }}
          SDK_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::FELINICS_BOT_TOKEN is not configured; skipping sync-sdk-docs dispatch to felinics/kibotos-docs for ${SDK_NAME}@${SDK_VERSION} (${RELEASE_TAG})."
            exit 0
          fi

          PAYLOAD="$(python3 -c '
          import json, os
          print(json.dumps({
              "event_type": "sync-sdk-docs",
              "client_payload": {
                  "sdk": os.environ["SDK_NAME"],
                  "version": os.environ["SDK_VERSION"],
                  "tag": os.environ["RELEASE_TAG"],
                  "source_repo": "felinics/kibotos-sdk",
              },
          }))
          ')"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/felinics/kibotos-docs/dispatches" \
            -d "$PAYLOAD"

          echo "Dispatched sync-sdk-docs for ${SDK_NAME}@${SDK_VERSION} (${RELEASE_TAG})."

name: Release Python SDK

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish kibotos to PyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and verify version against pyproject.toml
        id: meta
        working-directory: sdks/python
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#python/v}"
          PKG_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${VERSION}) does not match sdks/python/pyproject.toml version (${PKG_VERSION})."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and build tools
        working-directory: sdks/python
        run: python -m pip install --upgrade pip build "httpx>=0.27" "pydantic>=2.7"

      - name: Run unit tests
        working-directory: sdks/python
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Build sdist and wheel
        working-directory: sdks/python
        run: python -m build

      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "kibotos (Python) v${{ steps.meta.outputs.version }}"
          files: sdks/python/dist/*
          generate_release_notes: true

  notify-docs:
    name: Notify Docs Sync
    needs: publish
    uses: ./.github/workflows/_notify-docs.yml
    with:
      sdk: python
      version: ${{ needs.publish.outputs.version }}
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

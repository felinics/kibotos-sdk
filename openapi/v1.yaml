components:
  schemas:
    openapi.APIError:
      properties:
        code:
          example: invalid_state
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          example: Human-readable message
          type: string
        request_id:
          example: req_01jd8k3m9qv7x2n4p6r8t0w2y7
          type: string
        retryable:
          example: false
          type: boolean
        status:
          example: 409
          type: integer
      type: object
    openapi.CreateExposureRequest:
      properties:
        port:
          example: 8080
          type: integer
        ttl_seconds:
          example: 3600
          type: integer
      type: object
    openapi.CreateVolumeRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: datasets
          type: string
        size_gib:
          example: 50
          type: integer
        zone:
          example: global-1
          type: string
      type: object
    openapi.CreateWorkspaceRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: agent-runner
          type: string
        network:
          $ref: '#/components/schemas/openapi.WorkspaceNetworkInput'
        resources:
          $ref: '#/components/schemas/openapi.WorkspaceResourcesInput'
        template:
          $ref: '#/components/schemas/openapi.WorkspaceTemplateInput'
        timeout:
          $ref: '#/components/schemas/openapi.WorkspaceTimeoutInput'
        volume:
          $ref: '#/components/schemas/openapi.WorkspaceVolumeInput'
        zone:
          example: global-1
          type: string
      type: object
    openapi.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/openapi.APIError'
      type: object
    openapi.Exposure:
      properties:
        created_at:
          type: string
        expires_at:
          type: string
        id:
          example: exp_01jd8k3m9qv7x2n4p6r8t0w2y6
          type: string
        port:
          example: 8080
          type: integer
        revoked_at:
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - revoked
          example: active
          type: string
        url:
          example: https://k7x2n4p6r8t0w2y6.kibo.run
          type: string
        workspace_id:
          example: wks_01jd8k3m9qv7x2n4p6r8t0w2y4
          type: string
      type: object
    openapi.ExposurePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Exposure'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
    openapi.Failure:
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      type: object
    openapi.LatestTemplateRevision:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    openapi.ResizeVolumeRequest:
      properties:
        size_gib:
          example: 100
          type: integer
      type: object
    openapi.StartWorkspaceRequest:
      properties:
        timeout:
          $ref: '#/components/schemas/openapi.WorkspaceTimeoutInput'
      type: object
    openapi.StopWorkspaceRequest:
      properties:
        force:
          example: false
          type: boolean
      type: object
    openapi.Template:
      properties:
        created_at:
          type:
            - string
            - "null"
        default_revision:
          example: r42
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        display_name:
          example: Python 3.12
          type: string
        id:
          example: python-3.12
          type: string
        latest_revision:
          anyOf:
            - $ref: '#/components/schemas/openapi.LatestTemplateRevision'
            - type: "null"
        owner:
          enum:
            - platform
            - organization
          example: platform
          type: string
        updated_at:
          type:
            - string
            - "null"
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplatePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Template'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplateProcess:
      properties:
        env:
          additionalProperties:
            type: string
          type: object
        shell:
          type: string
        user:
          type: string
        working_dir:
          type: string
      type: object
    openapi.TemplateRevision:
      properties:
        created_at:
          type:
            - string
            - "null"
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: r42
          type: string
        process:
          anyOf:
            - $ref: '#/components/schemas/openapi.TemplateProcess'
            - type: "null"
        ready_at:
          type:
            - string
            - "null"
        size_mib:
          type:
            - integer
            - "null"
        source:
          additionalProperties: {}
          type: object
        status:
          example: ready
          type: string
        template_id:
          example: python-3.12
          type: string
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplateRevisionPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.TemplateRevision'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
    openapi.UpdateVolumeRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      type: object
    openapi.UpdateWorkspaceRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      type: object
    openapi.Volume:
      properties:
        created_at:
          type: string
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: datasets
          type:
            - string
            - "null"
        size_gib:
          example: 50
          type: integer
        status:
          enum:
            - creating
            - available
            - attached
            - resizing
            - deleting
            - failed
            - lost
            - unknown
          example: available
          type: string
        updated_at:
          type: string
        workspace_id:
          type:
            - string
            - "null"
        zone:
          example: global-1
          type: string
      type: object
    openapi.VolumePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Volume'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.Workspace:
      properties:
        created_at:
          type: string
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: wks_01jd8k3m9qv7x2n4p6r8t0w2y4
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: agent-runner
          type:
            - string
            - "null"
        network:
          $ref: '#/components/schemas/openapi.WorkspaceNetwork'
        resources:
          $ref: '#/components/schemas/openapi.WorkspaceResources'
        status:
          enum:
            - creating
            - available
            - stopping
            - stopped
            - starting
            - deleting
            - failed
            - unknown
          example: available
          type: string
        template:
          $ref: '#/components/schemas/openapi.WorkspaceTemplate'
        timeout:
          anyOf:
            - $ref: '#/components/schemas/openapi.WorkspaceTimeout'
            - type: "null"
        updated_at:
          type: string
        volume:
          anyOf:
            - $ref: '#/components/schemas/openapi.WorkspaceVolume'
            - type: "null"
        zone:
          example: global-1
          type: string
      type: object
    openapi.WorkspaceNetwork:
      properties:
        applied:
          type:
            - boolean
            - "null"
        mode:
          enum:
            - public_internet
            - deny_all
          example: public_internet
          type: string
      type: object
    openapi.WorkspaceNetworkInput:
      properties:
        mode:
          enum:
            - public_internet
            - deny_all
          example: public_internet
          type: string
      type: object
    openapi.WorkspacePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Workspace'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.WorkspaceResources:
      properties:
        disk_mib:
          example: 20480
          type: integer
        memory_mib:
          example: 4096
          type: integer
        vcpus:
          example: 2
          type: integer
      type: object
    openapi.WorkspaceResourcesInput:
      properties:
        disk_mib:
          example: 20480
          type: integer
        memory_mib:
          example: 4096
          type: integer
        vcpus:
          example: 2
          type: integer
      type: object
    openapi.WorkspaceTemplate:
      properties:
        id:
          example: python-3.12
          type: string
        revision:
          example: r42
          type: string
      type: object
    openapi.WorkspaceTemplateInput:
      properties:
        id:
          example: python-3.12
          type: string
        revision:
          example: r42
          type: string
      type: object
    openapi.WorkspaceTimeout:
      properties:
        action:
          enum:
            - stop
            - delete
          example: stop
          type: string
        expires_at:
          type: string
      type: object
    openapi.WorkspaceTimeoutInput:
      properties:
        action:
          enum:
            - stop
            - delete
          example: stop
          type: string
        seconds:
          example: 3600
          type: integer
      type: object
    openapi.WorkspaceVolume:
      properties:
        delete_with_workspace:
          example: false
          type: boolean
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        mount_path:
          example: /data
          type: string
      type: object
    openapi.WorkspaceVolumeInput:
      properties:
        delete_with_workspace:
          example: false
          type: boolean
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        mount_path:
          example: /data
          type: string
      type: object
    openapi.Zone:
      properties:
        country:
          example: JP
          maxLength: 2
          minLength: 2
          type:
            - string
            - "null"
        default:
          example: true
          type: boolean
        display_name:
          example: Global 1
          type: string
        id:
          example: global-1
          type: string
        region:
          example: global
          type: string
        status:
          enum:
            - available
            - draining
          example: available
          type: string
      type: object
    openapi.ZonePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Zone'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Kibotos API key in the format: Bearer kb_<40 base62><6 base62 crc32>'
      in: header
      name: Authorization
      type: apiKey
info:
  description: Public v1 REST API for managing Kibotos workspaces, volumes, exposures, templates, and zones.
  title: Kibotos API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/templates:
    get:
      description: List available templates across zones permitted for the API key.
      operationId: listTemplates
      parameters:
        - description: Filter by owner (platform or organization)
          in: query
          name: owner
          schema:
            type: string
        - description: Filter by zone ID
          in: query
          name: zone
          schema:
            type: string
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.TemplatePage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List templates
      tags:
        - Templates
  /v1/templates/{id}:
    get:
      description: Retrieve a template by ID, with zones filtered to those permitted for the API key.
      operationId: getTemplate
      parameters:
        - description: Template ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Template'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get template
      tags:
        - Templates
  /v1/templates/{id}/revisions:
    get:
      description: List revisions of a template available in zones permitted for the API key.
      operationId: listTemplateRevisions
      parameters:
        - description: Template ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.TemplateRevisionPage'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List template revisions
      tags:
        - Templates
  /v1/templates/{id}/revisions/{revision_id}:
    get:
      description: Retrieve a specific revision of a template.
      operationId: getTemplateRevision
      parameters:
        - description: Template ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Template revision ID
          in: path
          name: revision_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.TemplateRevision'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get template revision
      tags:
        - Templates
  /v1/volumes:
    get:
      description: List persistent volumes across zones permitted for the API key. Supports filtering by zone, attached, and label.<key>=<value>.
      operationId: listVolumes
      parameters:
        - description: Filter by zone ID
          in: query
          name: zone
          schema:
            type: string
        - description: Filter by attachment state
          in: query
          name: attached
          schema:
            type: boolean
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.VolumePage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List volumes
      tags:
        - Volumes
    post:
      description: Create a new persistent Kibotos volume asynchronously.
      operationId: createVolume
      parameters:
        - description: Idempotency key (1-255 chars)
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.CreateVolumeRequest'
              description: Volume creation specification
              summary: body
        description: Volume creation specification
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Volume'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Create volume
      tags:
        - Volumes
  /v1/volumes/{id}:
    delete:
      description: Delete an unattached persistent volume asynchronously. Idempotent when already deleting.
      operationId: deleteVolume
      parameters:
        - description: Volume ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Volume'
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Delete volume
      tags:
        - Volumes
    get:
      description: Retrieve a persistent Kibotos volume by ID.
      operationId: getVolume
      parameters:
        - description: Volume ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Volume'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get volume
      tags:
        - Volumes
    patch:
      description: Update a volume's display name and merge-patch labels.
      operationId: updateVolume
      parameters:
        - description: Volume ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.UpdateVolumeRequest'
              description: Fields to update
              summary: body
        description: Fields to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Volume'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Update volume
      tags:
        - Volumes
  /v1/volumes/{id}/resize:
    post:
      description: Expand an available persistent volume asynchronously.
      operationId: resizeVolume
      parameters:
        - description: Volume ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Idempotency key (1-255 chars)
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.ResizeVolumeRequest'
              description: New volume size
              summary: body
        description: New volume size
        required: true
      responses:
        "202":
          content:
            application/json:

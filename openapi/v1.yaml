components:
  schemas:
    openapi.APIError:
      properties:
        code:
          example: invalid_state
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          example: Human-readable message
          type: string
        request_id:
          example: req_01jd8k3m9qv7x2n4p6r8t0w2y7
          type: string
        retryable:
          example: false
          type: boolean
        status:
          example: 409
          type: integer
      type: object
    openapi.CreateEgressRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: corp-socks5
          type: string
        protocol:
          enum:
            - socks5
          example: socks5
          type: string
        socks5:
          $ref: '#/components/schemas/openapi.EgressSocks5Input'
        udp_enabled:
          description: UDPEnabled Lets a udp resolver send its queries through this egress.
          example: true
          type: boolean
        zone:
          example: global-1
          type: string
      type: object
    openapi.CreateExposureRequest:
      properties:
        port:
          example: 8080
          type: integer
        ttl_seconds:
          example: 3600
          type: integer
      type: object
    openapi.CreateResolverRequest:
      properties:
        https:
          $ref: '#/components/schemas/openapi.ResolverHTTPS'
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: corp-dns
          type: string
        protocol:
          enum:
            - udp
            - tcp
            - tls
            - https
          example: udp
          type: string
        tcp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        tls:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        udp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        zone:
          example: global-1
          type: string
      type: object
    openapi.CreateVolumeRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: datasets
          type: string
        size_gib:
          example: 50
          type: integer
        zone:
          example: global-1
          type: string
      type: object
    openapi.CreateWorkspaceRequest:
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: agent-runner
          type: string
        network:
          $ref: '#/components/schemas/openapi.WorkspaceNetworkInput'
        packs:
          items:
            type: string
          maxItems: 4
          type: array
          uniqueItems: false
        resources:
          $ref: '#/components/schemas/openapi.WorkspaceResourcesInput'
        template:
          $ref: '#/components/schemas/openapi.WorkspaceTemplateInput'
        timeout:
          $ref: '#/components/schemas/openapi.WorkspaceTimeoutInput'
        volume:
          $ref: '#/components/schemas/openapi.WorkspaceVolumeInput'
        volumes:
          items:
            $ref: '#/components/schemas/openapi.WorkspaceVolumeInput'
          type: array
          uniqueItems: false
        zone:
          example: global-1
          type: string
      type: object
    openapi.Egress:
      properties:
        created_at:
          type: string
        id:
          example: egr_01jd8k3m9qv7x2n4p6r8t0w2z1
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: corp-socks5
          type:
            - string
            - "null"
        protocol:
          enum:
            - socks5
          example: socks5
          type: string
        revision:
          description: Revision Increases by one each time the configuration is replaced.
          example: 1
          type: integer
        socks5:
          $ref: '#/components/schemas/openapi.EgressSocks5'
        udp_enabled:
          description: UDPEnabled Lets a udp resolver send its queries through this egress.
          example: true
          type: boolean
        updated_at:
          type: string
        zone:
          example: global-1
          type: string
      type: object
    openapi.EgressPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Egress'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.EgressSocks5:
      properties:
        address:
          description: Address SOCKS5 endpoint as host:port.
          example: proxy.example.com:1080
          type: string
        tls:
          anyOf:
            - $ref: '#/components/schemas/openapi.EgressTLS'
            - type: "null"
        username:
          example: kibotos
          type:
            - string
            - "null"
      type: object
    openapi.EgressSocks5Input:
      properties:
        address:
          description: Address SOCKS5 endpoint as host:port.
          example: proxy.example.com:1080
          type: string
        password:
          description: Password Write-only. It is never returned, so a replacement must send it again.
          format: password
          maxLength: 255
          type:
            - string
            - "null"
          writeOnly: true
        tls:
          anyOf:
            - $ref: '#/components/schemas/openapi.EgressTLSInput'
            - type: "null"
        username:
          example: kibotos
          maxLength: 255
          type:
            - string
            - "null"
      type: object
    openapi.EgressTLS:
      properties:
        ca_cert:
          description: CaCert PEM trust roots that replace the system roots for this endpoint.
          type:
            - string
            - "null"
        server_name:
          description: ServerName Name sent as SNI and verified against the endpoint certificate.
          example: proxy.example.com
          type:
            - string
            - "null"
      type: object
    openapi.EgressTLSInput:
      properties:
        ca_cert:
          description: CaCert PEM trust roots, at most 64 KiB. Replaces the system roots for this endpoint.
          type:
            - string
            - "null"
        server_name:
          description: ServerName Name sent as SNI and verified against the endpoint certificate. Defaults to the endpoint host.
          example: proxy.example.com
          type:
            - string
            - "null"
      type: object
    openapi.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/openapi.APIError'
      type: object
    openapi.ExecRequest:
      properties:
        argv:
          description: Argv is passed to the process as-is, without a shell. Use ["/bin/sh", "-c", "..."] for shell syntax.
          example:
            - python3
            - --version
          items:
            type: string
          type: array
          uniqueItems: false
        env:
          additionalProperties:
            type: string
          description: Env adds environment variables to the process.
          type: object
        max_output_bytes:
          description: MaxOutputBytes caps the combined stdout and stderr of a synchronous JSON response. It defaults to 1048576 and accepts at most 4194304.
          example: 1048576
          maximum: 4194304
          minimum: 1
          type: integer
        stdin:
          description: Stdin is written to the process after it starts, then standard input is closed.
          type:
            - string
            - "null"
        timeout_seconds:
          description: TimeoutSeconds defaults to 30. Synchronous JSON responses accept at most 600; use the event stream or the WebSocket channel for longer runs.
          example: 60
          minimum: 1
          type: integer
        user:
          description: User selects the template default user when omitted. It also accepts a user declared by the template, or "root".
          example: root
          type:
            - string
            - "null"
        working_dir:
          description: WorkingDir defaults to the home directory of the selected user. Relative paths resolve against it.
          example: /app
          type:
            - string
            - "null"
      type: object
    openapi.ExecResponse:
      properties:
        duration_ms:
          example: 42
          type: integer
        exit_code:
          example: 0
          type:
            - integer
            - "null"
        signal:
          description: Signal is the number of the signal that ended the process, or null.
          example: 9
          type:
            - integer
            - "null"
        stderr:
          type: string
        stdout:
          example: Python 3.12.7
          type: string
        termination_reason:
          description: TerminationReason mirrors the Kibotos process exit reason.
          enum:
            - exited
            - signaled
            - timed_out
            - canceled
            - failed
            - memory_saturated
            - out_of_memory
          example: exited
          type: string
        truncated:
          description: Truncated reports that the output exceeded max_output_bytes and the remainder was dropped.
          example: false
          type: boolean
      type: object
    openapi.Exposure:
      properties:
        created_at:
          type: string
        expires_at:
          type: string
        id:
          example: exp_01jd8k3m9qv7x2n4p6r8t0w2y6
          type: string
        port:
          example: 8080
          type: integer
        revoked_at:
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - revoked
          example: active
          type: string
        url:
          example: https://k7x2n4p6r8t0w2y6.kibo.run
          type: string
        workspace_id:
          example: wks_01jd8k3m9qv7x2n4p6r8t0w2y4
          type: string
      type: object
    openapi.ExposurePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Exposure'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
    openapi.Failure:
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      type: object
    openapi.FileEntry:
      properties:
        mode:
          example: "0644"
          type: string
        modified_at:
          type:
            - string
            - "null"
        name:
          example: main.py
          type: string
        path:
          description: Path is always the normalized absolute path.
          example: /app/main.py
          type: string
        size_bytes:
          example: 1024
          type: integer
        type:
          example: file
          type: string
      type: object
    openapi.FileList:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/openapi.FileEntry'
          type: array
          uniqueItems: false
        path:
          example: /app
          type: string
      type: object
    openapi.FileWriteResult:
      properties:
        path:
          example: /app/main.py
          type: string
        sha256:
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          type: string
        size_bytes:
          example: 1024
          type: integer
      type: object
    openapi.LatestTemplateRevision:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    openapi.MakeDirectoryRequest:
      properties:
        mode:
          example: "0755"
          type: string
        path:
          description: Path is absolute, or relative to the home directory of the selected user.
          example: /app/data
          type: string
        user:
          example: root
          type:
            - string
            - "null"
      type: object
    openapi.MoveFileRequest:
      properties:
        destination:
          example: /app/app.py
          type: string
        source:
          description: Source and Destination are absolute, or relative to the home directory of the selected user.
          example: /app/main.py
          type: string
        user:
          example: root
          type:
            - string
            - "null"
      type: object
    openapi.NetworkEgressRule:
      properties:
        destinations:
          description: Destinations Canonical IP addresses or CIDRs.
          example:
            - 10.0.0.0/8
          items:
            type: string
          type: array
          uniqueItems: false
        egress_id:
          description: EgressID Egress in the same zone and organization as the workspace.
          example: egr_01jd8k3m9qv7x2n4p6r8t0w2z1
          type: string
      type: object
    openapi.NetworkResolverPath:
      properties:
        egress_id:
          description: EgressID Required when type is egress. The egress must be listed in the same policy's egresses.
          example: egr_01jd8k3m9qv7x2n4p6r8t0w2z1
          type: string
        type:
          enum:
            - direct
            - egress
          example: egress
          type: string
      type: object
    openapi.NetworkResolverRule:
      properties:
        path:
          $ref: '#/components/schemas/openapi.NetworkResolverPath'
        resolver_id:
          description: ResolverID Resolver in the same zone and organization as the workspace.
          example: rsv_01jd8k3m9qv7x2n4p6r8t0w2z2
          type: string
      type: object
    openapi.Pack:
      properties:
        architecture:
          type: string
        default_revision:
          type: string
        description:
          type: string
        display_name:
          type: string
        guest_requirements:
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        provided_capabilities:
          items:
            type: string
          type: array
          uniqueItems: false
        published_at:
          type: string
        version:
          type: string
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
        - architecture
        - default_revision
        - description
        - display_name
        - guest_requirements
        - id
        - provided_capabilities
        - published_at
        - version
        - zones
      type: object
    openapi.PackPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Pack'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
        - data
        - next_page_token
        - unavailable_zones
      type: object
    openapi.PackRevision:
      properties:
        architecture:
          type: string
        guest_requirements:
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        pack_id:
          type: string
        provided_capabilities:
          items:
            type: string
          type: array
          uniqueItems: false
        published_at:
          type: string
        version:
          type: string
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
        - architecture
        - guest_requirements
        - id
        - pack_id
        - provided_capabilities
        - published_at
        - version
        - zones
      type: object
    openapi.ReplaceEgressRequest:
      properties:
        drain_seconds:
          description: DrainSeconds Seconds established connections keep running on the previous configuration (default 600).
          example: 60
          maximum: 3600
          minimum: 0
          type: integer
        protocol:
          enum:
            - socks5
          example: socks5
          type: string
        socks5:
          $ref: '#/components/schemas/openapi.EgressSocks5Input'
        udp_enabled:
          description: UDPEnabled Lets a udp resolver send its queries through this egress.
          example: true
          type: boolean
      type: object
    openapi.ReplaceResolverRequest:
      properties:
        https:
          $ref: '#/components/schemas/openapi.ResolverHTTPS'
        protocol:
          enum:
            - udp
            - tcp
            - tls
            - https
          example: udp
          type: string
        tcp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        tls:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        udp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
      type: object
    openapi.ResizeVolumeRequest:
      properties:
        size_gib:
          example: 100
          type: integer
      type: object
    openapi.Resolver:
      properties:
        created_at:
          type: string
        https:
          $ref: '#/components/schemas/openapi.ResolverHTTPS'
        id:
          example: rsv_01jd8k3m9qv7x2n4p6r8t0w2z2
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: corp-dns
          type:
            - string
            - "null"
        protocol:
          enum:
            - udp
            - tcp
            - tls
            - https
          example: udp
          type: string
        revision:
          description: Revision Increases by one each time the configuration is replaced.
          example: 1
          type: integer
        tcp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        tls:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        udp:
          $ref: '#/components/schemas/openapi.ResolverAddress'
        updated_at:
          type: string
        zone:
          example: global-1
          type: string
      type: object
    openapi.ResolverAddress:
      properties:
        address:
          description: Address udp and tcp take IP or IP:port (default port 53); tls also accepts a hostname (default port 853).
          example: 10.0.0.53:53
          type: string
      type: object
    openapi.ResolverHTTPS:
      properties:
        url:
          description: URL Endpoint as https://host[:port]/path.
          example: https://dns.example.com/dns-query
          type: string
      type: object
    openapi.ResolverPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Resolver'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.SetWorkspacePacksRequest:
      properties:
        packs:
          items:
            type: string
          maxItems: 4
          type: array
          uniqueItems: false
      required:
        - packs
      type: object
    openapi.SetWorkspaceVolumesRequest:
      properties:
        volumes:
          items:
            $ref: '#/components/schemas/openapi.WorkspaceVolumeInput'
          type: array
          uniqueItems: false
      required:
        - volumes
      type: object
    openapi.StartWorkspaceRequest:
      properties:
        timeout:
          $ref: '#/components/schemas/openapi.WorkspaceTimeoutInput'
      type: object
    openapi.StopWorkspaceRequest:
      properties:
        force:
          example: false
          type: boolean
      type: object
    openapi.Template:
      properties:
        created_at:
          type:
            - string
            - "null"
        default_revision:
          example: r42
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        display_name:
          example: Python 3.12
          type: string
        id:
          example: python-3.12
          type: string
        latest_revision:
          anyOf:
            - $ref: '#/components/schemas/openapi.LatestTemplateRevision'
            - type: "null"
        owner:
          enum:
            - platform
            - organization
          example: platform
          type: string
        updated_at:
          type:
            - string
            - "null"
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplatePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Template'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplateProcess:
      properties:
        env:
          additionalProperties:
            type: string
          type: object
        shell:
          type: string
        user:
          type: string
        working_dir:
          type: string
      type: object
    openapi.TemplateRevision:
      properties:
        created_at:
          type:
            - string
            - "null"
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: r42
          type: string
        process:
          anyOf:
            - $ref: '#/components/schemas/openapi.TemplateProcess'
            - type: "null"
        ready_at:
          type:
            - string
            - "null"
        size_mib:
          type:
            - integer
            - "null"
        source:
          additionalProperties: {}
          type: object
        status:
          example: ready
          type: string
        template_id:
          example: python-3.12
          type: string
        zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.TemplateRevisionPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.TemplateRevision'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
    openapi.UpdateEgressRequest:
      properties:
        labels:
          additionalProperties:
            type:
              - string
              - "null"
          description: Labels Values replace existing labels. A null value deletes the label.
          type: object
        name:
          type:
            - string
            - "null"
      type: object
    openapi.UpdateResolverRequest:
      properties:
        labels:
          additionalProperties:
            type:
              - string
              - "null"
          description: Labels Values replace existing labels. A null value deletes the label.
          type: object
        name:
          type:
            - string
            - "null"
      type: object
    openapi.UpdateVolumeRequest:
      properties:
        labels:
          additionalProperties:
            type:
              - string
              - "null"
          description: Labels Values replace existing labels. A null value deletes the label.
          type: object
        name:
          type:
            - string
            - "null"
      type: object
    openapi.UpdateWorkspaceRequest:
      properties:
        labels:
          additionalProperties:
            type:
              - string
              - "null"
          description: Labels Values replace existing labels. A null value deletes the label.
          type: object
        name:
          type:
            - string
            - "null"
        resources:
          $ref: '#/components/schemas/openapi.WorkspaceResourcesInput'
      type: object
    openapi.Volume:
      properties:
        created_at:
          type: string
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: datasets
          type:
            - string
            - "null"
        size_gib:
          example: 50
          type: integer
        status:
          enum:
            - creating
            - available
            - attached
            - resizing
            - deleting
            - failed
            - lost
            - unknown
          example: available
          type: string
        updated_at:
          type: string
        workspace_id:
          type:
            - string
            - "null"
        zone:
          example: global-1
          type: string
      type: object
    openapi.VolumePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Volume'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.Workspace:
      properties:
        created_at:
          type: string
        failure:
          anyOf:
            - $ref: '#/components/schemas/openapi.Failure'
            - type: "null"
        id:
          example: wks_01jd8k3m9qv7x2n4p6r8t0w2y4
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          example: agent-runner
          type:
            - string
            - "null"
        network:
          $ref: '#/components/schemas/openapi.WorkspaceNetwork'
        packs:
          items:
            $ref: '#/components/schemas/openapi.WorkspacePack'
          type: array
          uniqueItems: false
        resources:
          $ref: '#/components/schemas/openapi.WorkspaceResources'
        status:
          enum:
            - creating
            - available
            - stopping
            - stopped
            - starting
            - deleting
            - failed
            - unknown
          example: available
          type: string
        template:
          $ref: '#/components/schemas/openapi.WorkspaceTemplate'
        timeout:
          anyOf:
            - $ref: '#/components/schemas/openapi.WorkspaceTimeout'
            - type: "null"
        updated_at:
          type: string
        volume:
          anyOf:
            - $ref: '#/components/schemas/openapi.WorkspaceVolume'
            - type: "null"
        volumes:
          items:
            $ref: '#/components/schemas/openapi.WorkspaceVolume'
          type: array
          uniqueItems: false
        zone:
          example: global-1
          type: string
      type: object
    openapi.WorkspaceGuestMetricsPoint:
      properties:
        cpu_count:
          type: integer
        cpu_used_percent:
          type: number
        disk_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        memory_cache_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        memory_used_bytes:
          type: integer
        time:
          type: string
      required:
        - cpu_count
        - cpu_used_percent
        - disk_total_bytes
        - disk_used_bytes
        - memory_cache_bytes
        - memory_total_bytes
        - memory_used_bytes
        - time
      type: object
    openapi.WorkspaceHostMetricsPoint:
      properties:
        cpu_cores:
          type: number
        cpu_pressure_some_ratio:
          type: number
        io_pressure_full_ratio:
          type: number
        io_pressure_some_ratio:
          type: number
        memory_bytes:
          type: integer
        memory_pressure_full_ratio:
          type: number
        memory_pressure_some_ratio:
          type: number
        network_receive_bytes_per_second:
          type: number
        network_receive_dropped_per_second:
          type: number
        network_receive_packets_per_second:
          type: number
        network_transmit_bytes_per_second:
          type: number
        network_transmit_dropped_per_second:
          type: number
        network_transmit_packets_per_second:
          type: number
        time:
          type: string
      required:
        - time
      type: object
    openapi.WorkspaceMetrics:
      properties:
        earliest_time:
          type:
            - string
            - "null"
        guest:
          items:
            $ref: '#/components/schemas/openapi.WorkspaceGuestMetricsPoint'
          type: array
          uniqueItems: false
        host:
          items:
            $ref: '#/components/schemas/openapi.WorkspaceHostMetricsPoint'
          type: array
          uniqueItems: false
        step_seconds:
          type: integer
      required:
        - earliest_time
        - guest
        - host
        - step_seconds
      type: object
    openapi.WorkspaceNetwork:
      properties:
        allow:
          description: Allow Canonical IP addresses or CIDRs admitted even when deny also covers them.
          example:
            - 203.0.113.0/24
          items:
            type: string
          type: array
          uniqueItems: false
        applied:
          description: Applied True once the running workspace has confirmed the policy. Null while the workspace is not running.
          type:
            - boolean
            - "null"
        deny:
          description: Deny Canonical IP addresses or CIDRs refused for outbound traffic.
          example:
            - 198.51.100.0/24
          items:
            type: string
          type: array
          uniqueItems: false
        egresses:
          items:
            $ref: '#/components/schemas/openapi.NetworkEgressRule'
          type: array
          uniqueItems: false
        mode:
          enum:
            - public_internet
            - deny_all
          example: public_internet
          type: string
        resolvers:
          items:
            $ref: '#/components/schemas/openapi.NetworkResolverRule'
          type: array
          uniqueItems: false
      type: object
    openapi.WorkspaceNetworkInput:
      properties:
        allow:
          description: Allow Canonical IP addresses or CIDRs admitted even when deny also covers them.
          example:
            - 203.0.113.0/24
          items:
            type: string
          type: array
          uniqueItems: false
        deny:
          description: Deny Canonical IP addresses or CIDRs refused for outbound traffic.
          example:
            - 198.51.100.0/24
          items:
            type: string
          type: array
          uniqueItems: false
        drain_seconds:
          description: DrainSeconds Seconds connections moved by this change keep their old path (default 600). Only accepted by PUT /v1/workspaces/{id}/network.
          example: 60
          maximum: 3600
          minimum: 0
          type: integer
        egresses:
          description: Egresses At most one rule sending the listed destinations through an egress.
          items:
            $ref: '#/components/schemas/openapi.NetworkEgressRule'
          type: array
          uniqueItems: false
        mode:
          enum:
            - public_internet
            - deny_all
          example: public_internet
          type: string
        resolvers:
          description: Resolvers At most one rule replacing the default DNS upstream.
          items:
            $ref: '#/components/schemas/openapi.NetworkResolverRule'
          type: array
          uniqueItems: false
      type: object
    openapi.WorkspacePack:
      properties:
        id:
          type: string
        provided_capabilities:
          items:
            type: string
          type: array
          uniqueItems: false
        revision:
          type: string
      required:
        - id
        - provided_capabilities
        - revision
      type: object
    openapi.WorkspacePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Workspace'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
        unavailable_zones:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    openapi.WorkspaceResources:
      properties:
        disk_mib:
          example: 20480
          type: integer
        memory_mib:
          example: 4096
          type: integer
        vcpus:
          example: 2
          type: integer
      type: object
    openapi.WorkspaceResourcesInput:
      properties:
        disk_mib:
          example: 20480
          type: integer
        memory_mib:
          example: 4096
          type: integer
        vcpus:
          example: 2
          type: integer
      type: object
    openapi.WorkspaceTemplate:
      properties:
        id:
          example: python-3.12
          type: string
        revision:
          example: r42
          type: string
      type: object
    openapi.WorkspaceTemplateInput:
      properties:
        id:
          example: python-3.12
          type: string
        revision:
          example: r42
          type: string
      type: object
    openapi.WorkspaceTimeout:
      properties:
        action:
          enum:
            - stop
            - delete
          example: stop
          type: string
        expires_at:
          type: string
      type: object
    openapi.WorkspaceTimeoutInput:
      properties:
        action:
          enum:
            - stop
            - delete
          example: stop
          type: string
        seconds:
          example: 3600
          type: integer
      type: object
    openapi.WorkspaceVolume:
      properties:
        delete_with_workspace:
          example: false
          type: boolean
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        mount_path:
          example: /data
          type: string
      type: object
    openapi.WorkspaceVolumeInput:
      properties:
        delete_with_workspace:
          example: false
          type: boolean
        id:
          example: vol_01jd8k3m9qv7x2n4p6r8t0w2y5
          type: string
        mount_path:
          example: /data
          type: string
      type: object
    openapi.Zone:
      properties:
        country:
          example: JP
          maxLength: 2
          minLength: 2
          type:
            - string
            - "null"
        default:
          example: true
          type: boolean
        description:
          example: Tokyo, Japan
          maxLength: 200
          type:
            - string
            - "null"
        display_name:
          example: Global 1
          type: string
        id:
          example: global-1
          type: string
        region:
          example: global
          type: string
        status:
          enum:
            - available
            - draining
          example: available
          type: string
      type: object
    openapi.ZonePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/openapi.Zone'
          type: array
          uniqueItems: false
        next_page_token:
          type:
            - string
            - "null"
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Kibotos API key in the format: Bearer kb_<40 base62><6 base62 crc32>'
      in: header
      name: Authorization
      type: apiKey
info:
  description: Public v1 REST API for managing Kibotos workspaces, volumes, exposures, templates, and zones.
  title: Kibotos API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/egresses:
    get:
      description: List egresses across zones permitted for the API key. Supports filtering by zone and label.<key>=<value>. Requires workspaces:read.
      operationId: listEgresses
      parameters:
        - description: Filter by zone ID
          in: query
          name: zone
          schema:
            type: string
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EgressPage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List egresses
      tags:
        - Egresses
    post:
      description: Create a SOCKS5 outbound proxy in a zone. Workspaces in the same zone can send selected destinations through it from their network policy. The password is write-only and never returned. Requires workspaces:write.
      operationId: createEgress
      parameters:
        - description: Idempotency key (1-255 chars)
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.CreateEgressRequest'
              description: Egress specification
              summary: body
        description: Egress specification
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Egress'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Create egress
      tags:
        - Egresses
  /v1/egresses/{id}:
    delete:
      description: Delete an egress. Returns 409 resource_in_use while the network policy of a workspace that has not been deleted still references it. Requires workspaces:write.
      operationId: deleteEgress
      parameters:
        - description: Egress ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Delete egress
      tags:
        - Egresses
    get:
      description: Retrieve an egress by ID. The password is never returned. Requires workspaces:read.
      operationId: getEgress
      parameters:
        - description: Egress ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Egress'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get egress
      tags:
        - Egresses
    patch:
      description: Update an egress's display name and merge-patch labels. Requires workspaces:write.
      operationId: updateEgress
      parameters:
        - description: Egress ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.UpdateEgressRequest'
              description: Fields to update
              summary: body
        description: Fields to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Egress'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Update egress
      tags:
        - Egresses
    put:
      description: Replace the protocol, endpoint, credentials, and UDP setting of an egress. The password must be sent again because it is never returned. Turning udp_enabled off while a workspace still routes a udp resolver through the egress returns 409 resource_in_use. Requires workspaces:write.
      operationId: replaceEgress
      parameters:
        - description: Egress ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Idempotency key (1-255 chars)
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.ReplaceEgressRequest'
              description: Complete egress configuration
              summary: body
        description: Complete egress configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Egress'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Replace egress configuration
      tags:
        - Egresses
  /v1/openapi.json:
    get:
      description: Return the OpenAPI 3.1 document of the Kibotos v1 API that this deployment serves. No authentication is required.
      operationId: getOpenAPIJSON
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OpenAPI 3.1 document
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Internal Server Error
      summary: Get the OpenAPI document (JSON)
      tags:
        - OpenAPI
  /v1/openapi.yaml:
    get:
      description: Return the OpenAPI 3.1 document of the Kibotos v1 API that this deployment serves. No authentication is required.
      operationId: getOpenAPIYAML
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: OpenAPI 3.1 document
      summary: Get the OpenAPI document (YAML)
      tags:
        - OpenAPI
  /v1/packs:
    get:
      description: List platform Packs across permitted zones. No additional scope is required.
      operationId: listPacks
      parameters:
        - description: Availability zone
          in: query
          name: zone
          schema:
            type: string
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.PackPage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Implemented
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List Packs
      tags:
        - Packs
  /v1/packs/{id}:
    get:
      description: Retrieve a platform Pack across permitted zones. No additional scope is required.
      operationId: getPack
      parameters:
        - description: Pack ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Pack'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Implemented
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get Pack
      tags:
        - Packs
  /v1/packs/{id}/revisions/{revision_id}:
    get:
      description: Retrieve an exact platform Pack revision. No additional scope is required.
      operationId: getPackRevision
      parameters:
        - description: Pack ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Revision ID
          in: path
          name: revision_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.PackRevision'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Not Implemented
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Get Pack revision
      tags:
        - Packs
  /v1/resolvers:
    get:
      description: List resolvers across zones permitted for the API key. Supports filtering by zone and label.<key>=<value>. Requires workspaces:read.
      operationId: listResolvers
      parameters:
        - description: Filter by zone ID
          in: query
          name: zone
          schema:
            type: string
        - description: Maximum items per page (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Opaque pagination cursor
          in: query
          name: page_token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ResolverPage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: List resolvers
      tags:
        - Resolvers
    post:
      description: Create a custom DNS upstream in a zone. protocol selects udp, tcp, tls (DNS over TLS), or https (DNS over HTTPS), and exactly the matching branch must be set. Requires workspaces:write.
      operationId: createResolver
      parameters:
        - description: Idempotency key (1-255 chars)
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openapi.CreateResolverRequest'
              description: Resolver specification
              summary: body
        description: Resolver specification
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.Resolver'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Create resolver
      tags:
        - Resolvers

      operationId: readWorkspaceFile
      parameters:
        - description: Workspace ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: File path, absolute or relative to the home directory of the selected user
          in: query
          name: path
          required: true
          schema:
            type: string
        - description: User whose identity and home directory apply (defaults to the template default user)
          in: query
          name: user
          schema:
            type: string
        - description: Byte range to return, for example bytes=0-1048575
          in: header
          name: Range
          schema:
            type: string
        - description: ETag of a copy the caller already holds
          in: header
          name: If-None-Match
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: File content
          headers:
            Accept-Ranges:
              description: Always bytes
              schema:
                type: string
            ETag:
              description: Entity tag of the file content
              schema:
                type: string
        "206":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Requested byte range
          headers:
            Accept-Ranges:
              description: Always bytes
              schema:
                type: string
            Content-Range:
              description: Returned byte range and total size
              schema:
                type: string
            ETag:
              description: Entity tag of the file content
              schema:
                type: string
